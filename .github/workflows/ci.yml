name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Reject duplicate JavaScript and TypeScript modules
        run: node .github/scripts/check-frontend-source-duplicates.mjs

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Type-check frontend when configured
        working-directory: frontend
        run: npm run typecheck --if-present

      - name: Test frontend
        working-directory: frontend
        run: npm test --if-present

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: sqlite:///./ci-nutrikids.db
      AUTO_CREATE_TABLES: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

  compose:
    name: Docker Compose configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MYSQL_DATABASE: nutrikids
      MYSQL_USER: nutrikids
      MYSQL_PASSWORD: ci-password
      MYSQL_ROOT_PASSWORD: ci-root-password
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate development configuration
        run: docker compose -f docker-compose.yml config -q

      - name: Validate production configuration
        run: docker compose -f docker-compose.prod.yml config -q
