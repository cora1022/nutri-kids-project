services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: nutrikids
      MYSQL_USER: nutrikids
      MYSQL_PASSWORD: nutrikids
      MYSQL_ROOT_PASSWORD: local-root-password
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-plocal-root-password"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://nutrikids:nutrikids@mysql:3306/nutrikids?charset=utf8mb4
      CORS_ORIGINS: http://localhost:5173
      AUTO_CREATE_TABLES: "true"
    volumes:
      - ./backend/app:/app/app
      - ./backend/scripts:/app/scripts
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /workspace
    environment:
      VITE_API_BASE_URL: /api/v1
      VITE_API_PROXY_TARGET: http://api:8000
    volumes:
      - ./frontend:/workspace
      - frontend_node_modules:/workspace/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  mysql_data:
  frontend_node_modules:
